name: Release Charts

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set chart version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${version}/; s/^appVersion:.*/appVersion: \"${version}\"/" deploy/cert-manager-webhook-abion/Chart.yaml

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          install_only: true

      - name: Package chart
        run: cr package deploy/cert-manager-webhook-abion

      - name: Upload chart to the release
        run: gh release upload "$GITHUB_REF_NAME" .cr-release-packages/*.tgz
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update Helm repository index
        run: cr index -o "${{ github.repository_owner }}" -r "${{ github.event.repository.name }}" --release-name-template "v{{ .Version }}" --push
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"